<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Estrategia de testing en tres niveles</text>

  <!-- Tier 3: E2E (top, narrow) -->
  <polygon points="380,60 520,60 470,150 430,150" fill="#fff6e8" stroke="#c98a1a" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">E2E</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#3a3a3a">pocos</text>

  <!-- Tier 2: Integration (middle) -->
  <polygon points="330,160 570,160 500,290 400,290" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="450" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Integración</text>
  <text x="450" y="233" text-anchor="middle" font-size="11" fill="#3a3a3a">algunos más</text>

  <!-- Tier 1: Unit (bottom, wide) -->
  <polygon points="280,300 620,300 500,420 400,420" fill="#eefaf0" stroke="#2e9e5b" stroke-width="2"/>
  <text x="450" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Unitarios</text>
  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#3a3a3a">la mayoría</text>

  <!-- Right-side explanation boxes with connector lines -->
  <line x1="520" y1="100" x2="640" y2="100" stroke="#c98a1a" stroke-width="1.5"/>
  <rect x="640" y="70" width="230" height="80" rx="8" fill="#fff6e8" stroke="#c98a1a" stroke-width="1.5"/>
  <text x="755" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">VaporSkeletonKitE2ESupport</text>
  <text x="755" y="108" text-anchor="middle" font-size="11" fill="#3a3a3a">HTTP/MCP real contra un</text>
  <text x="755" y="123" text-anchor="middle" font-size="11" fill="#3a3a3a">servidor ya arrancado</text>
  <text x="755" y="138" text-anchor="middle" font-size="11" fill="#3a3a3a">(a menudo la imagen Docker)</text>

  <line x1="565" y1="220" x2="640" y2="220" stroke="#3b6fd4" stroke-width="1.5"/>
  <rect x="640" y="190" width="230" height="80" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="755" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">VaporSkeletonKitTesting</text>
  <text x="755" y="228" text-anchor="middle" font-size="11" fill="#3a3a3a">withTestApp + Postgres real,</text>
  <text x="755" y="243" text-anchor="middle" font-size="11" fill="#3a3a3a">Application en proceso vía</text>
  <text x="755" y="258" text-anchor="middle" font-size="11" fill="#3a3a3a">VaporTesting</text>

  <line x1="610" y1="360" x2="640" y2="360" stroke="#2e9e5b" stroke-width="1.5"/>
  <rect x="640" y="330" width="230" height="80" rx="8" fill="#eefaf0" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="755" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Sin este kit</text>
  <text x="755" y="368" text-anchor="middle" font-size="11" fill="#3a3a3a">Testing/Swift Testing puros:</text>
  <text x="755" y="383" text-anchor="middle" font-size="11" fill="#3a3a3a">lógica de dominio, sin red</text>
  <text x="755" y="398" text-anchor="middle" font-size="11" fill="#3a3a3a">ni base de datos</text>

  <text x="450" y="470" text-anchor="middle" font-size="12" fill="#6a6a6a">Cada nivel prueba lo que el nivel de abajo no puede: aislamiento → base de datos real → red real.</text>
  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#6a6a6a">Este kit aporta las utilidades de los dos niveles superiores; los unitarios son responsabilidad</text>
  <text x="450" y="508" text-anchor="middle" font-size="12" fill="#6a6a6a">exclusiva del proyecto consumidor.</text>
</svg>
