<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="320" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">De Package.swift a un servidor respondiendo</text>

  <rect x="20" y="70" width="150" height="80" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="95" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Package.swift</text>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#3a3a3a">dependencia +</text>
  <text x="95" y="132" text-anchor="middle" font-size="11" fill="#3a3a3a">target ejecutable</text>

  <line x1="170" y1="110" x2="200" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="205" y="70" width="150" height="80" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="280" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">@main</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#3a3a3a">runApp(configure:</text>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#3a3a3a">configure)</text>

  <line x1="355" y1="110" x2="385" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="390" y="70" width="150" height="80" rx="8" fill="#eefaf0" stroke="#2e9e5b" stroke-width="2"/>
  <text x="465" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">configure(_:)</text>
  <text x="465" y="112" text-anchor="middle" font-size="11" fill="#3a3a3a">tu propio código,</text>
  <text x="465" y="126" text-anchor="middle" font-size="11" fill="#3a3a3a">el único que escribes</text>

  <line x1="540" y1="110" x2="570" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="575" y="70" width="150" height="80" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="650" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Postgres +</text>
  <text x="650" y="110" text-anchor="middle" font-size="11" fill="#3a3a3a">registerHealthRoute</text>
  <text x="650" y="126" text-anchor="middle" font-size="11" fill="#3a3a3a">(este kit)</text>

  <line x1="725" y1="110" x2="755" y2="110" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <rect x="760" y="70" width="120" height="80" rx="8" fill="#fff6e8" stroke="#c98a1a" stroke-width="2"/>
  <text x="820" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">GET /health</text>
  <text x="820" y="122" text-anchor="middle" font-size="11" fill="#3a3a3a">200 OK</text>

  <text x="450" y="220" text-anchor="middle" font-size="12" fill="#6a6a6a">runApp(configure:) arranca la Application, ejecuta tu configure(_:) una única vez,</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#6a6a6a">y sirve peticiones hasta el apagado — el resto de este esquema es lo que tú añades dentro de configure(_:).</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
