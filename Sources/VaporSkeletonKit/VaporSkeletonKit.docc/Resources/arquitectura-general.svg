<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <!-- Consumer project -->
  <rect x="150" y="20" width="600" height="90" rx="10" fill="#eefaf0" stroke="#2e9e5b" stroke-width="2"/>
  <text x="450" y="50" text-anchor="middle" font-size="19" font-weight="600" fill="#1a1a1a">Proyecto consumidor (p. ej. BackendSkeleton)</text>
  <text x="450" y="75" text-anchor="middle" font-size="14" fill="#3a3a3a">Lógica de negocio propia + configure(_:) + rutas/modelos del dominio</text>
  <text x="450" y="95" text-anchor="middle" font-size="13" fill="#6a6a6a">(lo único que este kit deja para que el proyecto escriba)</text>

  <!-- arrows down -->
  <line x1="230" y1="110" x2="185" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="110" x2="450" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="110" x2="715" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- WorkOSBearerAuth -->
  <rect x="60" y="150" width="220" height="80" rx="10" fill="#f5eeff" stroke="#7c4fd4" stroke-width="2"/>
  <text x="170" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">WorkOSBearerAuth</text>
  <text x="170" y="200" text-anchor="middle" font-size="13" fill="#3a3a3a">Autenticación bearer</text>
  <text x="170" y="217" text-anchor="middle" font-size="13" fill="#3a3a3a">contra WorkOS AuthKit</text>

  <!-- VaporSkeletonKit -->
  <rect x="340" y="150" width="220" height="80" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">VaporSkeletonKit</text>
  <text x="450" y="200" text-anchor="middle" font-size="13" fill="#3a3a3a">Infraestructura genérica</text>
  <text x="450" y="217" text-anchor="middle" font-size="13" fill="#3a3a3a">sin lógica de negocio</text>

  <!-- GitHub Actions -->
  <rect x="620" y="150" width="220" height="80" rx="10" fill="#fff6e8" stroke="#c98a1a" stroke-width="2"/>
  <text x="730" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">GitHub Actions</text>
  <text x="730" y="200" text-anchor="middle" font-size="13" fill="#3a3a3a">compartidas (CI/CD)</text>
  <text x="730" y="217" text-anchor="middle" font-size="13" fill="#3a3a3a">referenciadas por path</text>

  <!-- both feed the running Application -->
  <line x1="170" y1="230" x2="400" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="230" x2="450" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="290" width="360" height="60" rx="10" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
  <text x="450" y="316" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Application de Vapor en ejecución</text>
  <text x="450" y="336" text-anchor="middle" font-size="13" fill="#3a3a3a">rutas REST + servidor MCP montado, ambos autenticados igual</text>

  <!-- Three products of VaporSkeletonKit -->
  <line x1="450" y1="230" x2="450" y2="270" stroke="#3b6fd4" stroke-width="2"/>
  <line x1="450" y1="270" x2="220" y2="410" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="450" y1="270" x2="450" y2="410" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arrowblue)"/>
  <line x1="450" y1="270" x2="680" y2="410" stroke="#3b6fd4" stroke-width="2" marker-end="url(#arrowblue)"/>

  <text x="450" y="392" text-anchor="middle" font-size="13" fill="#6a6a6a">tres productos SPM independientes</text>

  <rect x="80" y="410" width="280" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="220" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">VaporSkeletonKit</text>
  <text x="220" y="458" text-anchor="middle" font-size="12" fill="#3a3a3a">runApp, Postgres, MCP,</text>
  <text x="220" y="474" text-anchor="middle" font-size="12" fill="#3a3a3a">health check, OpenAPI docs</text>
  <text x="220" y="498" text-anchor="middle" font-size="12" fill="#2e9e5b" font-weight="600">se enlaza en producción</text>

  <rect x="370" y="410" width="280" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="510" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">VaporSkeletonKitTesting</text>
  <text x="510" y="458" text-anchor="middle" font-size="12" fill="#3a3a3a">withTestApp, sendMCP —</text>
  <text x="510" y="474" text-anchor="middle" font-size="12" fill="#3a3a3a">tests de integración (VaporTesting)</text>
  <text x="510" y="498" text-anchor="middle" font-size="12" fill="#c98a1a" font-weight="600">solo en el target de tests</text>

  <rect x="640" y="410" width="220" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="750" y="435" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">VaporSkeletonKit</text>
  <text x="750" y="452" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">E2ESupport</text>
  <text x="750" y="474" text-anchor="middle" font-size="12" fill="#3a3a3a">E2EHTTPClient, E2EMCPClient</text>
  <text x="750" y="498" text-anchor="middle" font-size="12" fill="#c98a1a" font-weight="600">sin Vapor — HTTP real</text>

  <text x="450" y="560" text-anchor="middle" font-size="13" fill="#6a6a6a">Sin dependencias entre sí: cada producto se enlaza solo donde hace falta.</text>
  <text x="450" y="582" text-anchor="middle" font-size="13" fill="#6a6a6a">VaporSkeletonKit nunca importa VaporSkeletonKitTesting ni E2ESupport.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b6fd4"/>
    </marker>
  </defs>
</svg>
