<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="760" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">Ciclo de vida de una petición tools/call</text>

  <!-- Lane headers -->
  <text x="90"  y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">Cliente MCP</text>
  <text x="290" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">Vapor</text>
  <text x="500" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">MCPHTTPBridge</text>
  <text x="700" y="70" text-anchor="middle" font-size="13" font-weight="600" fill="#3a3a3a">MCP.Server + herramienta</text>

  <line x1="90"  y1="80" x2="90"  y2="700" stroke="#dddddd" stroke-width="2"/>
  <line x1="290" y1="80" x2="290" y2="700" stroke="#dddddd" stroke-width="2"/>
  <line x1="500" y1="80" x2="500" y2="700" stroke="#dddddd" stroke-width="2"/>
  <line x1="700" y1="80" x2="700" y2="700" stroke="#dddddd" stroke-width="2"/>

  <!-- Step 1 -->
  <line x1="90" y1="110" x2="285" y2="110" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#1a1a1a">1. POST /mcp (JSON-RPC "tools/call")</text>

  <!-- Step 2: Vapor routes to handler -->
  <rect x="240" y="130" width="100" height="34" rx="6" fill="#eef4ff" stroke="#3b6fd4"/>
  <text x="290" y="151" text-anchor="middle" font-size="11" fill="#1a1a1a">app.on(...)</text>
  <line x1="290" y1="164" x2="500" y2="190" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">2. enruta al handler</text>

  <!-- Step 3: bridge builds fresh server -->
  <rect x="450" y="200" width="360" height="70" rx="8" fill="#fff6e8" stroke="#c98a1a" stroke-width="2"/>
  <text x="630" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">3. handleMCPRequest(_:)</text>
  <text x="630" y="240" text-anchor="middle" font-size="11" fill="#3a3a3a">crea un MCP.Server + StatelessHTTPServerTransport</text>
  <text x="630" y="256" text-anchor="middle" font-size="11" fill="#3a3a3a">nuevos y aislados para esta petición</text>

  <line x1="700" y1="270" x2="700" y2="300" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <text x="770" y="290" text-anchor="middle" font-size="11" fill="#1a1a1a">4. server.start</text>

  <!-- Step 5: dispatch -->
  <rect x="450" y="310" width="360" height="70" rx="8" fill="#eef4ff" stroke="#3b6fd4" stroke-width="2"/>
  <text x="630" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">5. MCPToolDispatch.call(...)</text>
  <text x="630" y="350" text-anchor="middle" font-size="11" fill="#3a3a3a">busca la herramienta por nombre entre las</text>
  <text x="630" y="366" text-anchor="middle" font-size="11" fill="#3a3a3a">registradas al montar el servidor</text>

  <line x1="700" y1="380" x2="700" y2="410" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <text x="790" y="400" text-anchor="middle" font-size="11" fill="#1a1a1a">6. tool.call(...)</text>

  <!-- Step 7: tool executes -->
  <rect x="620" y="420" width="190" height="60" rx="8" fill="#eefaf0" stroke="#2e9e5b" stroke-width="2"/>
  <text x="715" y="444" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Tu MCPTool</text>
  <text x="715" y="462" text-anchor="middle" font-size="11" fill="#3a3a3a">lógica de negocio</text>

  <!-- Branching: success vs MCPToolError -->
  <line x1="700" y1="480" x2="700" y2="510" stroke="#555" stroke-width="2" marker-end="url(#g)"/>
  <text x="450" y="505" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">7. resultado o MCPToolError lanzado</text>

  <rect x="450" y="520" width="360" height="70" rx="8" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
  <text x="630" y="542" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">8. MCPToolDispatch atrapa el error</text>
  <text x="630" y="560" text-anchor="middle" font-size="11" fill="#3a3a3a">MCPToolError → CallTool.Result(isError: true)</text>
  <text x="630" y="576" text-anchor="middle" font-size="11" fill="#3a3a3a">nunca un fallo de transporte JSON-RPC</text>

  <line x1="500" y1="590" x2="500" y2="620" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <text x="580" y="610" text-anchor="middle" font-size="11" fill="#1a1a1a">9. server.stop + vaporResponse()</text>

  <line x1="290" y1="640" x2="95" y2="670" stroke="#3b6fd4" stroke-width="2" marker-end="url(#a)"/>
  <rect x="240" y="620" width="100" height="34" rx="6" fill="#eef4ff" stroke="#3b6fd4"/>
  <text x="290" y="641" text-anchor="middle" font-size="11" fill="#1a1a1a">Response</text>
  <text x="190" y="662" text-anchor="middle" font-size="12" fill="#1a1a1a">10. 200 OK con el JSON-RPC de respuesta</text>

  <text x="450" y="730" text-anchor="middle" font-size="12" fill="#6a6a6a">El servidor MCP y el transporte se crean y destruyen en cada petición: el modo stateless del SDK</text>
  <text x="450" y="748" text-anchor="middle" font-size="12" fill="#6a6a6a">no admite reutilizar una misma instancia entre clientes independientes.</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b6fd4"/>
    </marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
